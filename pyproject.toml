[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-eyetracker"
version = "0.1.0"
description = "Unified calibration and benchmarking framework for web and desktop eye trackers"
authors = [{ name = "Vasily Apasov" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "websockets>=12.0",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "opencv-python>=4.10",
  "pyzmq>=26.0",
  "pygame>=2.5",
  "msgpack>=1.0"
]

[project.scripts]
eyetrack = "eyetrk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
